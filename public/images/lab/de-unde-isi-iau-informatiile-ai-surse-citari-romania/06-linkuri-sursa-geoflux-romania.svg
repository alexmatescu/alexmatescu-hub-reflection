<title id="t">Linkuri-sursă afișate în medie pe răspuns, România</title><desc id="d">Grafic cu bare orizontale: în raportul GEOflux pentru România, consultat la 7 noiembrie 2026, Perplexity a afișat în medie 11,7 linkuri-sursă pe răspuns, ChatGPT 7,0 și Gemini 4,7.</desc>
