<title id="t">Utilizarea AI în România și în UE, 2025</title><desc id="d">Grafic cu bare grupate, Eurostat 2025: AI generativ 16–74 ani România 17,8%, UE 32,7%; AI generativ 16–24 ani România 44,1%, UE 63,8%; întreprinderi care folosesc AI România 5,2%, UE 20,0%.</desc>
