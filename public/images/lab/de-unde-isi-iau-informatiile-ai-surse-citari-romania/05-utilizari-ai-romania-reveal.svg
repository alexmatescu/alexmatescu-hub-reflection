<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Ce fac utilizatorii români de AI în legătură cu cumpărăturile</title><desc id="d">Grafic cu bare orizontale, sondaj Reveal 2026: 91% caută informații despre branduri și produse, 65% compară produse și prețuri, 65% declară influență asupra deciziei de cumpărare, 55% citesc sau rezumă recenzii, 41% obțin recomandări personalizate.</desc>
<rect x="0.5" y="0.5" width="959" height="413" rx="8" fill="#fcfcfb" stroke="#e4e2dc"/>
<text x="32" y="44" font-size="22" font-weight="600" fill="#0b0b0b">Ce fac utilizatorii români de AI în legătură cu cumpărăturile</text>
<text x="32" y="72" font-size="15" fill="#52514e">Procent din utilizatorii AI dintr-un eșantion de 1.000 de adulți din mediul urban, online, 14–20 ian. 2026</text>
<text x="268" y="132.0" font-size="16" text-anchor="end" fill="#0b0b0b">Informații despre branduri</text>
<path d="M282,112 h549.28 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-549.28 z" fill="#2a78d6"/>
<text x="845.28" y="132.0" font-size="16" font-weight="600" fill="#0b0b0b">91%</text>
<text x="268" y="180.0" font-size="16" text-anchor="end" fill="#0b0b0b">Compară produse și prețuri</text>
<path d="M282,160 h391.2 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-391.2 z" fill="#2a78d6"/>
<text x="687.2" y="180.0" font-size="16" font-weight="600" fill="#0b0b0b">65%</text>
<text x="268" y="228.0" font-size="16" text-anchor="end" fill="#0b0b0b">Influență asupra cumpărării</text>
<path d="M282,208 h391.2 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-391.2 z" fill="#2a78d6"/>
<text x="687.2" y="228.0" font-size="16" font-weight="600" fill="#0b0b0b">65%</text>
<text x="268" y="276.0" font-size="16" text-anchor="end" fill="#0b0b0b">Citesc sau rezumă recenzii</text>
<path d="M282,256 h330.4 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-330.4 z" fill="#2a78d6"/>
<text x="626.4" y="276.0" font-size="16" font-weight="600" fill="#0b0b0b">55%</text>
<text x="268" y="324.0" font-size="16" text-anchor="end" fill="#0b0b0b">Recomandări personalizate</text>
<path d="M282,304 h245.28 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-245.28 z" fill="#2a78d6"/>
<text x="541.28" y="324.0" font-size="16" font-weight="600" fill="#0b0b0b">41%</text>
