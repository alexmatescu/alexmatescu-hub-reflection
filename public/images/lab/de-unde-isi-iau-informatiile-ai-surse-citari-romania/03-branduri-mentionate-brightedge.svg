<title id="t">Numărul mediu de branduri menționate pe interogare</title><desc id="d">Grafic cu bare orizontale: Google AI Overviews 6,02 branduri menționate în medie pe interogare, ChatGPT 2,37, Google AI Mode 1,59.</desc>
<rect x="0.5" y="0.5" width="959" height="347" rx="8" fill="#fcfcfb" stroke="#e4e2dc"/>
<text x="32" y="44" font-size="22" font-weight="600" fill="#0b0b0b">Numărul mediu de branduri menționate pe interogare</text>
<text x="32" y="72" font-size="15" fill="#52514e">Zeci de mii de interogări identice, comparate în trei produse AI (BrightEdge, august 2025)</text>
<text x="238" y="132.0" font-size="16" text-anchor="end" fill="#0b0b0b">Google AI Overviews</text>
<path d="M252,112 h536.08 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-536.08 z" fill="#2a78d6"/>
<text x="802.08" y="132.0" font-size="16" font-weight="600" fill="#0b0b0b">6,02</text>
<text x="238" y="180.0" font-size="16" text-anchor="end" fill="#0b0b0b">ChatGPT</text>
<path d="M252,160 h208.62285714285716 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-208.62285714285716 z" fill="#2a78d6"/>
<text x="474.62285714285713" y="180.0" font-size="16" font-weight="600" fill="#0b0b0b">2,37</text>
<text x="238" y="228.0" font-size="16" text-anchor="end" fill="#0b0b0b">Google AI Mode</text>
<path d="M252,208 h138.6457142857143 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-138.6457142857143 z" fill="#2a78d6"/>
<text x="404.6457142857143" y="228.0" font-size="16" font-weight="600" fill="#0b0b0b">1,59</text>
<line x1="252" y1="104" x2="252" y2="246" stroke="#52514e" stroke-width="1"/>
<text x="32" y="278" font-size="14" fill="#52514e">Valorile sunt numere medii de branduri, nu procente și nu rate de citare.</text>
<text x="32" y="324" font-size="13" fill="#77756f">Sursa: BrightEdge, „ChatGPT vs Google AI: 62% Brand Recommendation Disagreement”, 27 aug. 2025 — brightedge.com</text>
