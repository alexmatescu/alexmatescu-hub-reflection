<title id="t">Media surselor citate pe răspuns, studiul Prefer</title><desc id="d">Grafic cu bare orizontale: Perplexity 19,48 surse citate în medie pe răspuns, Gemini 8,64, Claude 4,58, ChatGPT 3,05, în studiul Prefer din septembrie 2026.</desc>
