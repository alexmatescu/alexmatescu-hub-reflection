<svg xmlns="http://www.w3.org/2000/svg" width="960" height="396" viewBox="0 0 960 396" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title id="t">De câte sisteme a fost citat fiecare domeniu</title><desc id="d">Grafic cu bare orizontale: 966 de domenii (72,7%) citate de un singur sistem, 205 (15,4%) de două, 129 (9,7%) de trei și 29 (2,2%) de toate patru.</desc>
<rect x="0.5" y="0.5" width="959" height="395" rx="8" fill="#fcfcfb" stroke="#e4e2dc"/>
<text x="32" y="44" font-size="22" font-weight="600" fill="#0b0b0b">De câte sisteme a fost citat fiecare domeniu</text>
<text x="32" y="72" font-size="15" fill="#52514e">1.329 de domenii distincte citate în cele 960 de răspunsuri ale studiului Prefer</text>
<text x="238" y="132.0" font-size="16" text-anchor="end" fill="#0b0b0b">Un singur sistem</text>
<path d="M252,112 h448.088 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-448.088 z" fill="#2a78d6"/>
<text x="714.088" y="132.0" font-size="16" font-weight="600" fill="#0b0b0b">966 domenii  (72,7%)</text>
<text x="238" y="180.0" font-size="16" text-anchor="end" fill="#0b0b0b">Două sisteme</text>
<path d="M252,160 h91.94 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-91.94 z" fill="#2a78d6"/>
<text x="357.94" y="180.0" font-size="16" font-weight="600" fill="#0b0b0b">205 domenii  (15,4%)</text>
<text x="238" y="228.0" font-size="16" text-anchor="end" fill="#0b0b0b">Trei sisteme</text>
<path d="M252,208 h56.372 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-56.372 z" fill="#2a78d6"/>
<text x="322.372" y="228.0" font-size="16" font-weight="600" fill="#0b0b0b">129 domenii  (9,7%)</text>
<text x="238" y="276.0" font-size="16" text-anchor="end" fill="#0b0b0b">Toate patru</text>
<path d="M252,256 h9.572 a4,4 0 0 1 4,4 v22 a4,4 0 0 1 -4,4 h-9.572 z" fill="#2a78d6"/>
<text x="275.572" y="276.0" font-size="16" font-weight="600" fill="#0b0b0b">29 domenii  (2,2%)</text>
<line x1="252" y1="104" x2="252" y2="294" stroke="#52514e" stroke-width="1"/>
<text x="32" y="326" font-size="14" fill="#52514e">Totuși, 23 dintre cele 25 de domenii cel mai des citate au apărut în cel puțin trei sisteme.</text>
<text x="32" y="372" font-size="13" fill="#77756f">Sursa: Prefer, „How AI engines search and cite: 960 answers measured”, 19 sept. 2026 — tryprefer.com/data/ai-answer-study</text>
</svg>